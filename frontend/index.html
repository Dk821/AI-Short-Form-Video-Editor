    <title>Clipforge — AI Short-Form Video Editor</title>
    <!-- Inter + Space Grotesk are loaded locally instead of from Google
         Fonts — see src/main.jsx's preloadCoreFonts() and
         src/lib/captionLayout.js. This keeps the desktop build fully
         offline-capable (no runtime dependency on Google's CDN) and, more
         importantly, guarantees every caption using these families
         resolves to the EXACT SAME font file backend/app/render.py's
         FFmpeg export reads via font_manager.resolve_font() — a
         CDN-hosted copy of "the same" font is not guaranteed to be
         byte-identical to the bundled one. -->
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
